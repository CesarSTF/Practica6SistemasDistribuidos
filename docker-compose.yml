# docker-compose.yml - Configuración de RabbitMQ y Mosquitto
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto_broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/mosquitto/config:/mosquitto/config
      - ./mqtt/mosquitto/data:/mosquitto/data
    networks:
      - fleet-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - fleet-net
    restart: unless-stopped

  mqtt-bridge:
    build:
      context: ./mqtt
      dockerfile: Dockerfile.bridge
    container_name: mqtt_rabbitmq_bridge
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
    depends_on:
      mosquitto:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - fleet-net
    restart: unless-stopped

  fleet-api:
    build:
      context: ./fleet-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fleet-net
    restart: unless-stopped

  fleet-gps-service:
    build:
      context: ./fleet-gps-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fleet-net
    restart: unless-stopped

  fleet-alert-service:
    build:
      context: ./fleet-alert-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fleet-net
    restart: unless-stopped

  fleet-notification-service:
    build:
      context: ./fleet-notification-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fleet-net
    restart: unless-stopped

networks:
  fleet-net:
    driver: bridge
